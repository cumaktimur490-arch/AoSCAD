name: Windows C++ installer

on:
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to attach the installer to
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Locate vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($root)) { $root = 'C:\vcpkg' }
          $toolchain = Join-Path $root 'scripts/buildsystems/vcpkg.cmake'
          if (-not (Test-Path $toolchain)) { throw "vcpkg toolchain not found: $toolchain" }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using vcpkg at $root"

      - name: Relocate vcpkg build data to the workspace drive
        shell: pwsh
        run: |
          $storageRoot = Join-Path ([System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) 'vcpkg-build-data'
          New-Item -ItemType Directory -Path $storageRoot -Force | Out-Null
          foreach ($directory in @('buildtrees', 'downloads', 'packages', 'installed')) {
            $source = Join-Path $env:VCPKG_ROOT $directory
            $target = Join-Path $storageRoot $directory
            if (Test-Path -LiteralPath $source) {
              $sourceItem = Get-Item -LiteralPath $source -Force
              if (($sourceItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -eq 0) {
                Move-Item -LiteralPath $source -Destination $target
              }
            } else {
              New-Item -ItemType Directory -Path $target -Force | Out-Null
            }
            if (-not (Test-Path -LiteralPath $source)) {
              New-Item -ItemType Junction -Path $source -Target $target | Out-Null
            }
          }
          $tempDirectory = Join-Path $storageRoot 'temp'
          New-Item -ItemType Directory -Path $tempDirectory -Force | Out-Null
          "VCPKG_DOWNLOADS=$(Join-Path $storageRoot 'downloads')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tempDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tempDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | ForEach-Object {
            Write-Host ("Drive {0}: {1:N1} GB free" -f $_.DeviceID, ($_.FreeSpace / 1GB))
          }

      - name: Configure native C++ build
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows-release "-DVCPKG_OVERLAY_TRIPLETS=$env:GITHUB_WORKSPACE/triplets" -DCMAKE_BUILD_TYPE=Release 2>&1 | Tee-Object -FilePath native-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) { exit $buildExitCode }

      - name: Compile AoSCAD Studio
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath native-build.log -Append
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) { exit $buildExitCode }

      - name: Package Windows installer
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'stage'
          $release = Join-Path $PWD 'release'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          New-Item -ItemType Directory -Path $release -Force | Out-Null

          cmake --install build --config Release --prefix $stage 2>&1 | Tee-Object -FilePath native-build.log -Append
          $packageExitCode = $LASTEXITCODE
          if ($packageExitCode -ne 0) { exit $packageExitCode }

          $vcpkgPrefix = Join-Path $PWD 'build/vcpkg_installed/x64-windows-release'
          $runtimeBin = Join-Path $vcpkgPrefix 'bin'
          if (-not (Test-Path $runtimeBin)) { throw "vcpkg runtime DLL directory not found: $runtimeBin" }
          Get-ChildItem $runtimeBin -Filter '*.dll' -File | Copy-Item -Destination $stage -Force
          $env:PATH = "$runtimeBin;$env:PATH"

          $deployTool = Get-ChildItem $vcpkgPrefix -Filter 'windeployqt.exe' -File -Recurse | Select-Object -First 1
          if (-not $deployTool) { throw 'windeployqt.exe was not installed by the Qt vcpkg feature.' }
          & $deployTool.FullName --release --compiler-runtime --no-translations (Join-Path $stage 'aoscad-studio.exe') 2>&1 | Tee-Object -FilePath native-build.log -Append
          $deployExitCode = $LASTEXITCODE
          if ($deployExitCode -ne 0) { exit $deployExitCode }

          $compilerPath = (Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue).Source
          if (-not $compilerPath) {
            choco install innosetup --yes --no-progress 2>&1 | Tee-Object -FilePath native-build.log -Append
            $installExitCode = $LASTEXITCODE
            if ($installExitCode -ne 0) { exit $installExitCode }
            $compilerPath = (Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue).Source
          }
          if (-not $compilerPath) {
            $programDirs = @($env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ }
            $compilerFile = Get-ChildItem -Path $programDirs -Filter 'ISCC.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($compilerFile) { $compilerPath = $compilerFile.FullName }
          }
          if (-not $compilerPath) { throw 'Inno Setup compiler ISCC.exe was not found.' }

          & $compilerPath "/O$release" '/FAoSCAD-Studio-Setup-0.2.0-x64' 'installer/aoscad.iss' 2>&1 | Tee-Object -FilePath native-build.log -Append
          $installerExitCode = $LASTEXITCODE
          if ($installerExitCode -ne 0) { exit $installerExitCode }
          $installer = Join-Path $release 'AoSCAD-Studio-Setup-0.2.0-x64.exe'
          if (-not (Test-Path $installer)) { throw "Installer output missing: $installer" }
          Write-Host "Created $installer"

      - name: Surface build diagnostics
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path native-build.log) {
            Get-Content native-build.log -Tail 45 | ForEach-Object {
              $line = $_.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows installer build detail::$line"
            }
          }

      - name: Upload diagnostic build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: AoSCAD-Studio-native-build-log
          path: native-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload installer artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: AoSCAD-Studio-Windows-x64
          path: release/AoSCAD-Studio-Setup-0.2.0-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG 'release/AoSCAD-Studio-Setup-0.2.0-x64.exe' --clobber
